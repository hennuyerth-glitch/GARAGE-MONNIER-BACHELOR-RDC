<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Garage Monnier — L'Épine</title>
<desc id="desc">Logo horizontal du Garage Monnier — L'Épine, avec une silhouette de l'île de Noirmoutier.</desc>
<rect x="56" y="20" width="1088" height="360" rx="18" fill="#fff" stroke="#003b70" stroke-width="7"/>
<g fill="#003b70" font-family="Montserrat,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="91" font-size="34" font-weight="700" letter-spacing="14">GARAGE</text>
  <text x="600" y="205" font-size="108" font-weight="800" letter-spacing="1">MONNIER</text>
  <text x="600" y="253" font-size="28" font-weight="700" letter-spacing="8">L'ÉPINE</text>
</g>
<!-- accent jaune exactement au niveau du I -->
<path d="M632 114 H664 L632 146 Z" fill="#f4c400"/>
<g fill="none" stroke="#003b70" stroke-width="5" stroke-linecap="round">
  <path d="M255 244 H445"/>
  <path d="M755 244 H945"/>
</g>
<!-- silhouette compacte de Noirmoutier, entièrement contenue dans le logo -->
<g transform="translate(508 270)">
  <path d="M22 2 C10 8 7 19 12 29 C17 39 19 48 16 58 C13 70 18 79 28 86 C39 94 43 103 40 114 C37 126 42 136 53 142 C65 149 71 158 69 169 C67 179 61 188 68 197 C75 207 87 213 99 219 L114 207 C105 199 100 191 101 182 C102 172 111 163 108 153 C105 142 93 136 92 125 C91 115 99 106 98 96 C96 84 87 78 82 68 C78 59 82 49 78 40 C74 30 64 27 58 19 C51 8 37 -2 22 2 Z" fill="#003b70"/>
  <circle cx="19" cy="19" r="6" fill="#f4c400"/>
  <g fill="none" stroke="#2c8fc4" stroke-width="4" stroke-linecap="round">
    <path d="M91 72 C126 60 156 64 186 76"/>
    <path d="M96 86 C133 75 165 79 198 91"/>
    <path d="M101 100 C139 89 172 94 207 106"/>
  </g>
</g>
</svg>