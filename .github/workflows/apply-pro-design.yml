name: Appliquer la finition pro

on:
  push:
    branches: [main]
    paths:
      - 'pro.css'
      - '.github/workflows/apply-pro-design.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Brancher le nouveau design et forcer le cache à jour
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('style.css')
          text = css.read_text()
          imp = "@import url('pro.css?v=20260911-pro1');"
          if imp not in text:
              css.write_text(text + "\n" + imp + "\n")

          js = Path('script.js')
          text = js.read_text()
          text = text.replace('logo.svg?v=20260911-logo', 'logo.svg?v=20260911-pro1')
          js.write_text(text)
          PY

      - name: Publier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          if git diff --cached --quiet; then
            echo 'Aucune modification à publier.'
            exit 0
          fi
          git commit -m 'Applique la finition professionnelle et actualise le logo'
          git push
